<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mini Games</title>
  <meta name="description" content="Kumpulan minigame seru yang bisa langsung dimainkan di browser.">
  <link rel="stylesheet" href="hub.css">
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>🕹️ Mini Games</h1>
      <p>Kumpulan minigame seru, langsung main di browser. Tanpa install, tanpa daftar.</p>
    </header>

    <main>
      <h2 class="section-title">Pilih game</h2>
      <div class="grid" id="grid"></div>
      <noscript><p class="nojs">Aktifkan JavaScript untuk melihat daftar game.</p></noscript>
    </main>

    <footer class="footer">
      Dibuat dengan Node.js dan HTML5 Canvas
    </footer>
  </div>
  <script src="hub.js"></script>
</body>
</html>
